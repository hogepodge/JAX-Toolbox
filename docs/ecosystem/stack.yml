# ==========================================================================
# JAX on NVIDIA-GPU Stack — diagram structure + project registry
# ==========================================================================
# Source of truth for the ecosystem-overview page. Consumed by
# scripts/build-ecosystem.mjs (see docs/ecosystem/plan.md).
#
# Conventions / assumptions to VERIFY (drafted from the stack diagram image):
#   * `category` = box FILL color (NVIDIA palette, no pink):
#       nvidia = NVIDIA green (developed OR optimized)   jax = JAX Blue   other = gray
#     "optimized" is why Tokamax and AlphaFold3 are green even though they
#     originate at Google/DeepMind — NVIDIA ships first-class GPU paths for both.
#   * `nvidia_contributes: true` = a GREEN OUTLINE on the box, i.e. a JAX-native /
#     OSS project that NVIDIA actively contributes to. Independent of fill: a
#     JAX-Blue project can carry the green outline. Applied to the JAX-Blue boxes
#     below; VERIFY the exact set against the diagram.
#   * The image's "native JAX" and "JAX compatible" regions are merged into a
#     single `jax-ecosystem` layer for v1 (see plan §15). Split later if wanted.
#   * Full-width layers (core, native-xla, hardware) span all columns; their
#     `column` is only used for left→right ordering within the band.
#   * `overview` snippet files don't exist yet — the generator emits a graceful
#     "coming soon" placeholder + warning until they're authored (plan §7).
# ==========================================================================

# Columns rendered left → right.
columns:
  - id: tooling
    label: Tooling
  - id: training
    label: Training / Post-Training
  - id: inference
    label: Inference

# Layers rendered bottom → top (array order = vertical position, bottom first).
layers:
  - id: hardware
    label: Hardware
    span: full
  - id: native-xla
    label: native XLA
    span: full
  - id: core
    label: JAX · XLA · Pathways
    span: full
  - id: jax-ecosystem
    label: JAX ecosystem
  - id: frameworks
    label: Frameworks

# Category → legend label + CSS class (fill colors defined in fern/main.css).
categories:
  nvidia:
    label: NVIDIA-developed / optimized
    class: eco-cat-nvidia
  jax:
    label: JAX-native / OSS ecosystem
    class: eco-cat-jax
  other:
    label: Other / runtime
    class: eco-cat-other

# The `nvidia_contributes: true` flag renders as a green outline (CSS class
# eco-contributes) and gets its own legend entry:
contribution:
  label: NVIDIA contributes (green outline)
  class: eco-contributes

# --------------------------------------------------------------------------
# Projects. Grouped by layer (top → bottom) for readability only; the
# generator re-orders by layers[] then columns[] then list order.
# --------------------------------------------------------------------------
projects:

