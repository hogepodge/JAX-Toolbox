# ==========================================================================
# JAX on NVIDIA-GPU Stack — flexible grid model
# ==========================================================================
# Source of truth for the ecosystem-overview page. Consumed by
# scripts/build-ecosystem.mjs (see docs/ecosystem/plan.md).
#
# MODEL (CSS-grid-backed; supports weighted widths + 2-D spans):
#   columns  — vertical tracks, each with a `width` weight (fr units).
#   rows     — horizontal bands, top -> bottom (array order = visual order).
#   cells    — placed groups of project boxes. Each cell occupies a rectangle:
#                col      starting column id        (required)
#                colSpan  # of columns to span      (default 1)
#                row      starting row id           (required)
#                rowSpan  # of rows to span          (default 1)
#                projects ordered list of project ids shown in the cell
#              A cell may span multiple columns (e.g. overlap Tooling+Training)
#              and/or multiple rows. Overlapping/overflowing spans are warned
#              about and clamped, never fatal.
#   projects — registry only: id, name, category, href, overview. Placement
#              lives in `cells`, NOT here.
#
# category = box FILL color (NVIDIA palette): nvidia = green (developed OR
# optimized), jax = JAX Blue, other = gray. "optimized" is why Tokamax and
# AlphaFold3 are green though they originate at Google/DeepMind.
# ==========================================================================

# Vertical tracks. `width` = relative fr units (Tooling/Inference narrow,
# Training wide). Add/remove columns freely — the grid template is generated.
columns:
  - { id: tooling,   label: Tooling,                   width: 2 }
  - { id: training,  label: Training / Post-Training,  width: 4 }
  - { id: inference, label: Inference,                 width: 2 }

# Horizontal bands, top -> bottom.
rows:
  - { id: frameworks,  label: Frameworks }
  - { id: ecosystem,   label: JAX ecosystem }
  - { id: core,        label: "JAX · XLA · Pathways" }
  - { id: native-xla,  label: native XLA }
  - { id: hardware,    label: Hardware }

# Fill categories -> legend label + CSS class (colors in fern/main.css).
categories:
  nvidia: { label: NVIDIA-developed / optimized, class: eco-cat-nvidia }
  jax:    { label: JAX-native / OSS ecosystem,   class: eco-cat-jax }
  other:  { label: Other / runtime,              class: eco-cat-other }

# Placement. Each cell is a rectangle on the columns x rows grid.
cells:
  # --- Frameworks ---
  - { col: tooling,   row: frameworks, projects: [nsight, nsys-jax] }
  - { col: training,  row: frameworks, projects: [maxtext, maxdiffusion, axlearn] }
  - { col: inference, row: frameworks, projects: [alphafold3] }
  # --- JAX ecosystem ---
  - { col: tooling,   row: ecosystem,  projects: [xprof] }
  - { col: training,  row: ecosystem,  projects: [grain, optax, orbax, tunix, qwix, flax, pallas-mosaicgpu, jaxpp, te, warp, cuequivariance, cutile, cutlass, tokamax] }
  - { col: inference, row: ecosystem,  projects: [flashinfer, mlir-trt] }
  # --- Full-width foundation bands (span all 3 columns) ---
  - { col: tooling, colSpan: 3, row: core,       projects: [jax, xla, pathways] }
  - { col: tooling, colSpan: 3, row: native-xla, projects: [cupti, cudnn, cublas, nccl, nvshmem] }
  - { col: tooling, colSpan: 3, row: hardware,   projects: [hw-datacenter, hw-workstation, hw-rtx, hw-jetson] }
  #
  # Examples of the new flexibility (uncomment / adapt):
  #   - { col: tooling, colSpan: 2, row: ecosystem, projects: [...] }   # overlap Tooling+Training
  #   - { col: inference, rowSpan: 2, row: ecosystem, projects: [...] } # span two rows tall

# Project registry (placement is in `cells`). Static nodes (no `overview`),
# e.g. hardware, render as non-clickable labels.
projects:
  - { id: maxtext,          name: MaxText,              category: jax,    href: ../frameworks/maxtext/README.md,                 overview: projects/maxtext.md }
  - { id: maxdiffusion,     name: MaxDiffusion,         category: jax,    href: https://github.com/AI-Hypercomputer/maxdiffusion, overview: projects/maxdiffusion.md }
  - { id: axlearn,          name: AXLearn,              category: jax,    href: ../frameworks/axlearn/README.md,                 overview: projects/axlearn.md }
  - { id: alphafold3,       name: AlphaFold3,           category: nvidia, href: https://github.com/google-deepmind/alphafold3,    overview: projects/alphafold3.md } # green = NVIDIA-optimized container; upstream Google DeepMind
  - { id: nsight,           name: Nsight Systems,       category: nvidia, href: https://developer.nvidia.com/nsight-systems,      overview: projects/nsight.md }
  - { id: nsys-jax,         name: nsys-jax,             category: nvidia, href: ../nsys-jax.md,                                  overview: projects/nsys-jax.md }
  - { id: xprof,            name: XProf,                category: jax,    href: https://github.com/openxla/xprof,                 overview: projects/xprof.md }
  - { id: grain,            name: Grain,                category: jax,    href: https://github.com/google/grain,                 overview: projects/grain.md }
  - { id: optax,            name: Optax,                category: jax,    href: https://github.com/google-deepmind/optax,         overview: projects/optax.md }
  - { id: orbax,            name: Orbax,                category: jax,    href: https://github.com/google/orbax,                 overview: projects/orbax.md }
  - { id: tunix,            name: Tunix,                category: jax,    href: https://github.com/google/tunix,                 overview: projects/tunix.md }
  - { id: qwix,             name: Qwix,                 category: jax,    href: https://github.com/google/qwix,                  overview: projects/qwix.md }
  - { id: flax,             name: Flax,                 category: jax,    href: https://github.com/google/flax,                  overview: projects/flax.md }
  - { id: pallas-mosaicgpu, name: Pallas / Mosaic GPU,  category: jax,    href: https://docs.jax.dev/en/latest/pallas/index.html, overview: projects/pallas-mosaicgpu.md }
  - { id: jaxpp,            name: JaxPP,                category: nvidia, href: https://github.com/NVIDIA/JaxPP,                  overview: projects/jaxpp.md }
  - { id: te,               name: TransformerEngine,    category: nvidia, href: https://github.com/NVIDIA/TransformerEngine,      overview: projects/transformer-engine.md }
  - { id: warp,             name: Warp,                 category: nvidia, href: https://github.com/NVIDIA/warp,                   overview: projects/warp.md }
  - { id: cuequivariance,   name: cuEquivariance,       category: nvidia, href: https://github.com/NVIDIA/cuEquivariance,         overview: projects/cuequivariance.md }
  - { id: cutile,           name: cuTile,               category: nvidia,                                                        overview: projects/cutile.md }
  - { id: cutlass,          name: CUTLASS,              category: nvidia, href: https://github.com/NVIDIA/cutlass,                overview: projects/cutlass.md }
  - { id: tokamax,          name: Tokamax,              category: nvidia, href: https://github.com/google/tokamax,                overview: projects/tokamax.md } # green = NVIDIA-optimized GPU kernels; upstream Google
  - { id: flashinfer,       name: FlashInfer,           category: nvidia, href: https://github.com/flashinfer-ai/flashinfer,      overview: projects/flashinfer.md }
  - { id: mlir-trt,         name: MLIR-TRT,             category: nvidia, href: https://github.com/NVIDIA/TensorRT-Incubator,     overview: projects/mlir-trt.md }
  - { id: jax,              name: JAX,                  category: jax,    href: https://github.com/jax-ml/jax,                    overview: projects/jax.md }
  - { id: xla,              name: XLA,                  category: jax,    href: https://github.com/openxla/xla,                   overview: projects/xla.md }
  - { id: pathways,         name: Pathways,             category: other,                                                         overview: projects/pathways.md }
  - { id: cupti,            name: CUPTI,                category: nvidia, href: https://docs.nvidia.com/cupti/,                   overview: projects/cupti.md }
  - { id: cudnn,            name: cuDNN,                category: nvidia, href: https://developer.nvidia.com/cudnn,               overview: projects/cudnn.md }
  - { id: cublas,           name: cuBLAS / cuBLASLt,    category: nvidia, href: https://developer.nvidia.com/cublas,              overview: projects/cublas.md }
  - { id: nccl,             name: NCCL,                 category: nvidia, href: https://developer.nvidia.com/nccl,                overview: projects/nccl.md }
  - { id: nvshmem,          name: NVSHMEM,              category: nvidia, href: https://developer.nvidia.com/nvshmem,             overview: projects/nvshmem.md }
  - { id: hw-datacenter,    name: Datacenter,           category: nvidia }
  - { id: hw-workstation,   name: Workstations,         category: nvidia }
